name: Tests

on:
  # Branches only: a tag push runs these through the release workflow instead.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run the suite
        run: |
          failed=0
          for test in tests/*.lua; do
            echo "--- $test"
            lua5.4 "$test" || failed=1
          done
          exit $failed
